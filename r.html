<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando... | LinkCraft Pro</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .animate-progress {
      animation: progress 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-6">

  <!-- TOP BAR -->
  <header class="w-full max-w-md flex items-center justify-between text-xs text-slate-400">
    <div class="flex items-center space-x-2">
      <div class="w-6 h-6 rounded-md bg-sky-600 flex items-center justify-center text-white font-bold text-xs">
        <i class="fa-solid fa-link text-[10px]"></i>
      </div>
      <span class="font-extrabold text-white text-sm">LinkCraft</span>
      <span class="text-[10px] bg-sky-950 text-sky-400 border border-sky-800 px-1.5 py-0.2 rounded font-semibold">SAFE REDIRECT</span>
    </div>
    <span class="font-mono text-[11px] text-emerald-400 flex items-center">
      <i class="fa-solid fa-shield-check mr-1"></i> SSL 256-bit
    </span>
  </header>

  <!-- CENTER REDIRECT CARD -->
  <main class="w-full max-w-md bg-slate-800/80 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-6 sm:p-8 text-center shadow-2xl my-auto">
    
    <!-- Spinner / Pulse -->
    <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-sky-600/10 border border-sky-500/30 flex items-center justify-center text-sky-400 text-2xl animate-pulse">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </div>

    <h1 class="text-lg font-extrabold text-white mb-1">Redirecionando com segurança...</h1>
    <p class="text-xs text-slate-400 mb-6">Você está sendo encaminhado para o destino final verificado.</p>

    <!-- Destination Box -->
    <div class="bg-slate-900/90 rounded-xl p-3 border border-slate-700 text-left mb-6">
      <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center justify-between">
        <span>Destino</span>
        <span class="text-sky-400 font-mono text-[9px]" id="slug-badge">kip.to/...</span>
      </div>
      <p id="dest-url-display" class="font-mono text-xs text-sky-300 truncate font-semibold">https://...</p>
    </div>

    <!-- Progress Bar -->
    <div class="w-full bg-slate-700/60 h-2 rounded-full overflow-hidden mb-6">
      <div class="bg-gradient-to-r from-sky-500 to-indigo-500 h-2 rounded-full animate-progress"></div>
    </div>

    <!-- Action Link -->
    <div class="space-y-3">
      <a id="direct-btn" href="#" class="block w-full py-3 px-4 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs transition shadow-lg shadow-sky-600/20">
        Ir para o link agora <i class="fa-solid fa-arrow-right ml-1"></i>
      </a>
      <a href="index.html" class="block text-[11px] text-slate-400 hover:text-slate-200 transition">
        ← Voltar ao painel do LinkCraft Pro
      </a>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="text-[11px] text-slate-500 text-center">
    Protegido pela infraestrutura de telemetria da <strong class="text-slate-400">Kip Tecnologia</strong>
  </footer>

  <script>
    const defaultLinks = {
      'launch': 'https://kiptecnologia.com.br/releases/v2',
      'bio': 'bio.html',
      'bundle-5in1': 'https://kiptecnologia.gumroad.com/l/5-in-one',
      'github': 'https://github.com/KipTecnologia',
      'blackfriday': 'https://kiptecnologia.gumroad.com/l/linkcraft-pro'
    };

    function executeRedirect() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug') || window.location.hash.replace('#', '') || 'launch';

      // Look up in localStorage first
      let dest = defaultLinks[slug];
      try {
        const stored = localStorage.getItem('linkcraft_links_data');
        if (stored) {
          const links = JSON.parse(stored);
          const found = links.find(l => l.slug === slug);
          if (found) dest = found.dest;
        }
      } catch (e) {}

      if (!dest) {
        dest = 'index.html';
      }

      document.getElementById('slug-badge').innerText = `kip.to/${slug}`;
      document.getElementById('dest-url-display').innerText = dest;
      document.getElementById('direct-btn').href = dest;

      // Register telemetry click
      try {
        let clicks = JSON.parse(localStorage.getItem('linkcraft_clicks_telemetry') || '{}');
        clicks[slug] = (clicks[slug] || 0) + 1;
        localStorage.setItem('linkcraft_clicks_telemetry', JSON.stringify(clicks));
      } catch (e) {}

      // Auto redirect after 1.5 seconds
      setTimeout(() => {
        window.location.href = dest;
      }, 1500);
    }

    document.addEventListener('DOMContentLoaded', executeRedirect);
  </script>
</body>
</html>
